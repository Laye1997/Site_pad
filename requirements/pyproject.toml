[project]
name = "pad-site"
version = "0.1.0"
description = "Site du Port Autonome de Dakar — socle Django + Wagtail"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "DJ"]
ignore = ["S101"]

[tool.black]
line-length = 100
extend-exclude = "migrations"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = "migrations"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py", "tests.py"]
addopts = "-q"

[tool.coverage.run]
source = ["apps", "config"]
omit = ["*/migrations/*", "*/tests.py"]
