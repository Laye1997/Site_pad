# Développement / recette. Renseigner DJANGO_SECRET_KEY (ex. dans un fichier .env non versionné).
x-app: &app
  build: .
  environment: &app-env
    DJANGO_SETTINGS_MODULE: config.settings.prod
    DATABASE_URL: postgres://pad:pad@db:5432/pad
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Définir DJANGO_SECRET_KEY}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
    WAGTAILADMIN_BASE_URL: ${WAGTAILADMIN_BASE_URL:-http://localhost:8000}
    REDIS_URL: redis://redis:6379/0
    SENTRY_DSN: ${SENTRY_DSN:-}
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pad
      POSTGRES_USER: pad
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pad}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pad"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine

  web:
    <<: *app
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3

  worker:
    <<: *app
    command: celery -A config worker --loglevel=info

  beat:
    <<: *app
    command: celery -A config beat --loglevel=info

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    ports:
      - "8080:80"

volumes:
  pgdata:
