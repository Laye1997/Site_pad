name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  # Clé fictive réservée à la CI (jamais utilisée hors de ce pipeline).
  DJANGO_SECRET_KEY: ci-only-secret-key-0123456789-abcdefghijklmnopqrstuvwxyz

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements/dev.txt -r requirements/prod.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Format (black)
        run: black --check .
      - name: Types (mypy)
        run: mypy apps config
      - name: Migrations à jour
        run: python manage.py makemigrations --check --dry-run
      - name: Tests et couverture
        run: |
          coverage run -m pytest
          coverage report --fail-under=75
      - name: Vérification de déploiement
        run: python manage.py check --deploy --fail-level WARNING --settings=config.settings.prod
      - name: Audit des dépendances
        run: pip-audit -r requirements/prod.txt

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image
        run: docker build -t pad-site:ci .
