# Construit l'image Docker du site et la publie sur ghcr.io à chaque push sur main.
name: Image Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
                       platforms: linux/amd64
             provenance: false
             sbom: false
          tags: |
            ghcr.io/laye1997/site_pad:latest
            ghcr.io/laye1997/site_pad:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
