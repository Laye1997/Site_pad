# Construit l'image Docker du site à chaque push sur main et la publie :
#  - toujours sur ghcr.io (GitHub Container Registry) ;
#  - sur Docker Hub dans une tâche séparée, uniquement si les secrets DOCKERHUB_USERNAME et
#    DOCKERHUB_TOKEN existent (un souci Docker Hub ne fait donc jamais échouer ghcr.io).
name: Image Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ghcr:
    name: Publier sur ghcr.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: |
            ghcr.io/laye1997/site-pad:latest
            ghcr.io/laye1997/site-pad:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dockerhub:
    name: Publier sur Docker Hub
    runs-on: ubuntu-latest
    env:
      DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Vérifier les secrets Docker Hub
        id: secrets
        run: |
          if [ -n "${DH_USER}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "Secrets Docker Hub absents : publication ignorée."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.present == 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.secrets.outputs.present == 'true'

      - uses: docker/login-action@v3
        if: steps.secrets.outputs.present == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: steps.secrets.outputs.present == 'true'
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/site-pad:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/site-pad:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    name: Test de démarrage de l'image
    runs-on: ubuntu-latest
    needs: ghcr
    steps:
      - name: Démarrer l'image comme le fait l'hébergeur
        env:
          IMAGE: ghcr.io/laye1997/site-pad:${{ github.sha }}
          SMOKE_KEY: smoke-test-key-jetable-0123456789-abcdefghijklmnopqrstuvwxyz
        run: |
          docker pull "$IMAGE" >/dev/null
          logs() { docker logs smoke 2>&1 | tail -15 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g'; }
          probe() { # $1 = chemin, $2 = en-tête Host
            curl -s -o /dev/null -w '%{http_code}' -H "Host: $2" "http://localhost:8000$1" || true
          }
          start() {
            docker rm -f smoke >/dev/null 2>&1 || true
            docker run -d --name smoke -p 8000:8000 "$@" "$IMAGE" >/dev/null
            for i in $(seq 1 30); do
              [ "$(probe /healthz/ localhost)" != "000" ] && break
              sleep 2
            done
          }

          # Cas A : réglages provisoires (HTTP toléré, tous les hôtes)
          start -e DJANGO_SETTINGS_MODULE=config.settings.prod -e DJANGO_SECRET_KEY="$SMOKE_KEY" \
                -e DJANGO_HTTPS=false -e DJANGO_ALLOWED_HOSTS='*'
          A_HEALTH=$(probe /healthz/ localhost)
          A_HOME=$(probe /fr/ localhost)
          A_STATE=$(docker inspect -f '{{.State.Status}}' smoke)
          echo "::notice title=Cas A (HTTPS=false, hôtes=*)::healthz=$A_HEALTH accueil=$A_HOME conteneur=$A_STATE"
          echo "::notice title=Cas A journaux::$(logs)"

          # Cas B : réglages stricts (HTTPS imposé, domaine de la plateforme uniquement)
          start -e DJANGO_SETTINGS_MODULE=config.settings.prod -e DJANGO_SECRET_KEY="$SMOKE_KEY" \
                -e DJANGO_HTTPS=true -e DJANGO_ALLOWED_HOSTS='.platform-systalink.com'
          B_HEALTH_LOCAL=$(probe /healthz/ localhost)
          B_HEALTH_DOMAIN=$(probe /healthz/ site-pad.platform-systalink.com)
          echo "::notice title=Cas B (HTTPS=true, hôte strict)::healthz(Host=localhost)=$B_HEALTH_LOCAL healthz(Host=domaine)=$B_HEALTH_DOMAIN"

          # Cas C : comme sur l'hébergeur (tables créées et contenu chargé au démarrage)
          start -e DJANGO_SETTINGS_MODULE=config.settings.prod -e DJANGO_SECRET_KEY="$SMOKE_KEY"                 -e DJANGO_HTTPS=false -e DJANGO_ALLOWED_HOSTS='*'                 -e RUN_MIGRATIONS=true -e SEED_ON_START=true
          C_HOME=000; C_PRO=000
          for i in $(seq 1 90); do
            C_HOME=$(probe /fr/ localhost)
            C_PRO=$(probe /fr/espace-pro/ localhost)
            [ "$C_HOME" = "200" ] && [ "$C_PRO" = "200" ] && break
            sleep 4
          done
          C_HEALTH=$(probe /healthz/ localhost)
          C_ROOT=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: localhost' http://localhost:8000/ || true)
          echo "::notice title=Cas C (migrations + contenu au démarrage)::healthz=$C_HEALTH racine=$C_ROOT accueil=$C_HOME espace-pro=$C_PRO"
          echo "::notice title=Cas C journaux::$(logs)"

          test "$A_HEALTH" = "200"
          test "$C_HEALTH" = "200"
          test "$C_HOME" = "200"
