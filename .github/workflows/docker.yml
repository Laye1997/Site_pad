# Construit l'image Docker du site et la publie sur Docker Hub à chaque push sur main.
name: Image Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/site-pad:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/site-pad:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
