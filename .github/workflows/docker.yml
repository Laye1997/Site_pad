# Construit l'image Docker du site à chaque push sur main et la publie :
#  - toujours sur ghcr.io (GitHub Container Registry) ;
#  - sur Docker Hub dans une tâche séparée, uniquement si les secrets DOCKERHUB_USERNAME et
#    DOCKERHUB_TOKEN existent (un souci Docker Hub ne fait donc jamais échouer ghcr.io).
name: Image Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ghcr:
    name: Publier sur ghcr.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: |
            ghcr.io/laye1997/site-pad:latest
            ghcr.io/laye1997/site-pad:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dockerhub:
    name: Publier sur Docker Hub
    runs-on: ubuntu-latest
    env:
      DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Vérifier les secrets Docker Hub
        id: secrets
        run: |
          if [ -n "${DH_USER}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "Secrets Docker Hub absents : publication ignorée."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.present == 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.secrets.outputs.present == 'true'

      - uses: docker/login-action@v3
        if: steps.secrets.outputs.present == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: steps.secrets.outputs.present == 'true'
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/site-pad:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/site-pad:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
