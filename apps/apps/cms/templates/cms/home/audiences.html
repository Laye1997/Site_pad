<section class="home-section home-section-muted" aria-labelledby="audiences-title">
  <div class="section-heading">
    {% if value.eyebrow %}<p class="eyebrow">{{ value.eyebrow }}</p>{% endif %}
    <h2 id="audiences-title">{{ value.title }}</h2>
    {% if value.intro %}<p class="section-intro">{{ value.intro }}</p>{% endif %}
  </div>
  <div class="audience-grid">
    {% for item in value.items %}
      <article class="audience-card">
        <span class="audience-number" aria-hidden="true">0{{ forloop.counter }}</span>
        <h3>{{ item.title }}</h3>
        <p>{{ item.text }}</p>
      </article>
    {% endfor %}
  </div>
</section>
