{% load static wagtailcore_tags wagtailimages_tags i18n %}
<section class="hm-dg" aria-labelledby="hm-dg-title">
  <figure class="hm-dg-photo">
    {% if value.image %}
      {% image value.image width-1000 loading="lazy" alt=value.image_alt %}
    {% else %}
      <img src="{% static 'img/mot-dg.jpg' %}" alt="{% translate 'Le Directeur Général du Port Autonome de Dakar' %}" loading="lazy" width="1200" height="800">
    {% endif %}
  </figure>
  <div class="hm-dg-copy">
    {% if value.eyebrow %}<p class="eyebrow">{{ value.eyebrow }}</p>{% endif %}
    <h2 id="hm-dg-title">{{ value.title }}</h2>
    <div class="hm-dg-text">{{ value.body|richtext }}</div>
  </div>
</section>
