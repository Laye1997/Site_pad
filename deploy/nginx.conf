# Reverse proxy devant Gunicorn : compression et cache des statiques, en-têtes transmis.
# Le nom « web » est résolu à chaque requête via le DNS interne de Docker : nginx démarre même si
# l'application n'est pas encore prête (évite « host not found in upstream »).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    client_max_body_size 10m;
    set $django_upstream http://web:8000;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /static/ {
        proxy_pass $django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Médias téléversés (images Wagtail, documents) : servis directement depuis le volume partagé.
    location /media/ {
        alias /app/media/;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        proxy_pass $django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
