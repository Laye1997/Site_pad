{% load static i18n core_tags %}
<section class="video-hero" aria-hidden="true">
  <video class="video-hero-bg" data-hero-video autoplay muted loop playsinline preload="metadata" aria-hidden="true" tabindex="-1">
    <source src="{% static 'video/hero-pad-mobile.mp4' %}" type="video/mp4" media="(max-width: 700px)">
    <source src="{% static 'video/hero-pad.mp4' %}" type="video/mp4">
  </video>
  <video class="video-hero-media" data-hero-video autoplay muted loop playsinline preload="metadata" aria-hidden="true" poster="{% static 'video/hero-pad-poster.jpg' %}">
    <source src="{% static 'video/hero-pad-mobile.mp4' %}" type="video/mp4" media="(max-width: 700px)">
    <source src="{% static 'video/hero-pad.mp4' %}" type="video/mp4">
  </video>
  <div class="video-hero-overlay"></div>
</section>
<div class="hero-statement">
  <div class="hero-statement-card">
    <div class="hero-statement-text">
      {% if value.eyebrow %}<p class="eyebrow">{{ value.eyebrow }}</p>{% endif %}
      <h1 id="home-title">{{ value.title }}</h1>
      {% if value.intro %}<p class="hero-intro">{{ value.intro }}</p>{% endif %}
      <a class="btn hero-statement-cta" href="{% slug_url "nous-decouvrir" %}">{% translate "Nous découvrir" %}</a>
    </div>
    <img class="hero-statement-icon" src="{% static 'img/logo-pad-color.png' %}" alt="" aria-hidden="true" width="378" height="110" loading="lazy">
  </div>
</div>
