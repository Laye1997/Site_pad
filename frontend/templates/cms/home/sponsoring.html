{% load static i18n %}
<section class="joj-video-section" aria-labelledby="joj-title">
  <div class="joj-video-copy">
    {% if value.eyebrow %}<p class="eyebrow">{{ value.eyebrow }}</p>{% endif %}
    <h2 id="joj-title">{{ value.title }}</h2>
    {% if value.text %}<p>{{ value.text }}</p>{% endif %}
  </div>
  <div class="joj-video-frame">
    <video id="joj-video" class="joj-video-media" autoplay muted loop playsinline preload="auto" poster="{% static 'video/joj-pad-poster.jpg' %}" aria-label="{% translate 'Vidéo du Port Autonome de Dakar partenaire officiel des JOJ Dakar 2026' %}">
      <source src="{% static 'video/joj-pad.mp4' %}" type="video/mp4">
    </video>
    <button class="video-toggle" data-video-target="joj-video" data-video-toggle type="button" aria-pressed="false"
            data-label-pause="{% translate 'Mettre la vidéo des JOJ en pause' %}" data-label-play="{% translate 'Lire la vidéo des JOJ' %}">
      <svg class="icon" aria-hidden="true" focusable="false" data-icon><use href="#i-pause"></use></svg>
      <span class="sr-only">{% translate "Mettre la vidéo des JOJ en pause" %}</span>
    </button>
  </div>
</section>
