<div class="table-wrap table-compact" role="region" tabindex="0" aria-label="{{ value.headers|join:' / ' }}">
  <table>
    <thead>
      <tr>{% for header in value.headers %}<th scope="col">{{ header }}</th>{% endfor %}</tr>
    </thead>
    <tbody>
      {% for row in value.rows %}
        <tr>{% for cell in row %}{% if forloop.first %}<th scope="row">{{ cell }}</th>{% else %}<td>{{ cell }}</td>{% endif %}{% endfor %}</tr>
      {% endfor %}
    </tbody>
  </table>
</div>
